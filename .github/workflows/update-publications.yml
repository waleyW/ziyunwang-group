name: Update publications
on:
  schedule:
    - cron: "17 14 * * *"   # nightly, about 3 am in Auckland
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_publications.py
      - run: |
          git config user.name "publications-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json
          git diff --cached --quiet || git commit -m "Update publications from OpenAlex"
          git push
