<head>

<title>People of T-Cat’s Journey</title>
<meta name="description" content="Personal pages for the members of the Theoretical Catalysis Group, University of Auckland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
<style>
/* Same storybook as T-Cat's Journey: parchment, ink, gold. One person per page, chosen by #slug. Single light theme by design. */
:root {
  --paper: #f4ead3; --paper2: #fbf6e9; --ink: #2b3550; --muted: #6c6a72; --line: rgba(43,53,80,.28);
  --gold: #c39a4c; --rose: #c8564b; --navy: #1b4c82;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;

  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 16px/1.65 var(--body); padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  background: radial-gradient(ellipse 80% 60% at 50% 0%, var(--paper2), transparent 70%), var(--paper); min-height: 100vh; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 600; text-wrap: balance; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cap { font: 500 .72rem var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.mono { font-family: var(--mono); font-size: .78rem; }
.sbtn { font: italic 600 1.02rem var(--display); color: var(--ink); background: var(--paper2); border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 16px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; transition: background .25s, transform .25s var(--bounce); }
.sbtn:hover { background: #f1e1b9; transform: translateY(-2px) rotate(-1deg); }
.page { background: var(--paper2); border: 1px solid var(--line); border-radius: 6px; outline: 1px solid var(--line); outline-offset: -8px; box-shadow: 0 18px 40px -26px rgba(43,53,80,.45); }


/* one person */
.profile { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 40px; padding: 34px; margin-block: 34px 24px; animation: open .6s var(--bounce); }
@keyframes open { from { opacity: 0; transform: translateY(14px) rotate(-.6deg); } }
.polaroid { background: #fffdf7; padding: 10px 10px 0; box-shadow: 0 14px 26px -14px rgba(43,53,80,.6), 0 0 0 1px rgba(43,53,80,.12); transform: rotate(-2deg); align-self: start; }
.polaroid img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 22%; display: block; }
.polaroid figcaption { font: italic 600 1.15rem var(--display); text-align: center; padding: 10px 0 12px; }
.profile h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1; }
.focus { font: italic 500 1.3rem/1.35 var(--display); color: var(--muted); margin: 10px 0 18px; }
.bio { margin: 0 0 20px; max-width: 62ch; }
.contact { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.contact .addr { font-family: var(--mono); font-size: .9rem; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.papers { margin-top: 26px; }
.papers h2 { font-size: 1.6rem; margin-bottom: 8px; }
.papers ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.papers li { border-left: 2px solid var(--gold); padding-left: 12px; }
.papers a { text-decoration: none; font-weight: 600; }
.papers a:hover { color: var(--navy); text-decoration: underline; }
.papers .j { font: italic 500 1rem var(--display); color: var(--muted); }
.papers .allp { margin: 12px 0 0; }
.empty { color: var(--muted); font: italic 500 1.1rem var(--display); }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
.source { color: var(--muted); font-size: .78rem; margin-top: 18px; }
.avatar3d { position: relative; aspect-ratio: 4 / 5; background: radial-gradient(ellipse at 50% 35%, #fffaf0, #efe3c7); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.avatar3d canvas, .avatar3d .poster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.avatar3d .poster { object-fit: contain; padding: 10%; transition: opacity .8s; }
.avatar3d canvas { opacity: 0; transition: opacity .8s; touch-action: pan-y; cursor: grab; }
.avatar3d.live canvas { opacity: 1; } .avatar3d.live .poster { opacity: 0; }
.avatar3d + .polaroid { width: 46%; margin: -48px 0 0 auto !important; position: relative; transform: rotate(4deg); }
.avatar3d + .polaroid figcaption { font-size: .9rem; padding: 6px 0 8px; }
@media (max-width: 720px) { .profile { grid-template-columns: 1fr; padding: 22px; gap: 24px; } .polaroid { max-width: 260px; } }

/* everyone */
.all { padding-block: 34px 50px; }
.all h1 { font-size: clamp(2.4rem, 6vw, 3.4rem); }
.all p { color: var(--muted); margin: 6px 0 24px; }
.all h2.sub { font-size: clamp(1.8rem, 4.5vw, 2.4rem); margin-top: 48px; scroll-margin-top: 80px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 18px; }
.grid a { text-decoration: none; transition: transform .45s var(--bounce); display: block; }
.grid a:hover { transform: rotate(0deg) translateY(-6px) scale(1.04) !important; }
.grid .polaroid { transform: none; }
.grid .polaroid figcaption { font-size: 1.05rem; padding: 8px 0 2px; }
.grid .rl { display: block; text-align: center; font: .64rem var(--mono); color: var(--muted); padding-bottom: 10px; }
@media (prefers-reduced-motion: reduce) { .profile { animation: none; } .grid a, .sbtn { transition: none; } }
footer { color: var(--muted); font-size: .82rem; padding-block: 20px 40px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="me" href="play.html"><img src="assets/shield.png" alt=""><b>T-Cat’s Journey</b></a>
  <nav aria-label="Site">
    <details class="menu"><summary>Fields</summary><div class="drop"><a href="field.html#ml">Machine learning</a><a href="field.html#dft">DFT computation</a><a href="field.html#exp">Experiment</a><a href="field.html#all">All papers</a></div></details>
    <details class="menu"><summary>People</summary><div class="drop" id="peopleMenu"></div></details>
    <a href="play.html">Home</a>
  </nav>
</div></header>
<div class="wrap">
  <main id="view"><p class="empty" style="padding:40px 0">Loading…</p></main>
  <footer>Theoretical Catalysis Group · School of Chemical Sciences, University of Auckland</footer>
</div>
<script src="js/common.js"></script>
<script>
const ROLE = { "Principal investigator": "Principal investigator", "Postdoctoral fellows": "Postdoctoral fellow", "PhD students": "PhD student", "Master's students": "Master’s student", "Visitors": "Visiting researcher", "Alumni": "Alumni" };
const norm = s => s.toLowerCase().replace(/[^a-z]/g, "");
let PEOPLE = [], PUBS = [];

function papersOf(p) {
  // match "Given Family" or "Family Given" in the author lists of the group's papers
  const [first, ...rest] = p.name.split(" "), a = norm(p.name), b = norm(rest.join("") + first);
  return PUBS.filter(x => x.a.some(n => { const k = norm(n); return k === a || k === b; })).slice(0, 6);
}
function profile(i) {
  const p = PEOPLE[i], prev = PEOPLE[(i - 1 + PEOPLE.length) % PEOPLE.length], next = PEOPLE[(i + 1) % PEOPLE.length], papers = papersOf(p);
  const sel = (p.selected || []).map(d => PUBS.find(x => x.doi.toLowerCase() === d.toLowerCase())).filter(Boolean);
  document.title = `${p.name} · T-Cat’s Journey`;
  $("#view").innerHTML = `
    <article class="page profile">
      <div>${p.slug === "ziyun-wang" ? `<div class="avatar3d" id="avatar3d"><img class="poster" src="assets/avatars/ziyun-wang-3d.png?v=1127" alt="A cartoon Ziyun Wang"><canvas aria-label="3D cartoon of Ziyun Wang. Drag to turn it."></canvas></div>` : ""}
      <figure class="polaroid" style="margin:0"><img src="assets/team/${p.slug}.jpg" alt="${esc(p.name)}"><figcaption>${esc(p.name)}</figcaption></figure></div>
      <div>
        <div class="cap">${esc(ROLE[p.role] || p.role)}</div>
        <h1>${esc(p.name)}</h1>
        ${p.focus ? `<p class="focus">${esc(p.focus)}</p>` : `<p class="focus">Theoretical Catalysis Group</p>`}
        ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : `<p class="bio empty">A longer introduction is on its way.</p>`}
        ${p.email ? `<div class="contact"><span class="addr" id="addr">${esc(p.email)}</span><button class="sbtn" id="copy" type="button">Copy email</button></div>` : ""}
        ${p.links?.length ? `<div class="links">${p.links.map(l => l.url.startsWith("mailto:") ? `<a class="sbtn" href="${esc(l.url)}">${esc(l.label)}</a>` : `<a class="sbtn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>` : ""}
        ${sel.length ? `<section class="papers"><h2>Selected publications</h2><ol>${sel.map(x => `<li><a href="https://doi.org/${esc(x.doi)}" target="_blank" rel="noopener">${esc(x.t)}</a><div class="j">${esc(x.j)}, ${x.y}</div></li>`).join("")}</ol><p class="allp"><a href="field.html#all">All ${PUBS.length} papers →</a></p></section>` : ""}
        ${papers.length && !sel.length ? `<section class="papers"><h2>Recent papers with the group</h2><ol>${papers.map(x => `<li><a href="https://doi.org/${esc(x.doi)}" target="_blank" rel="noopener">${esc(x.t)}</a><div class="j">${esc(x.j)}, ${x.y}</div></li>`).join("")}</ol></section>` : ""}
        ${p.source ? `<p class="source">Introduction adapted from the <a href="${esc(p.source)}" target="_blank" rel="noopener">group website</a>.</p>` : ""}
      </div>
    </article>
    <nav class="pager" aria-label="Other people"><a class="sbtn" href="#${prev.slug}">← ${esc(prev.name)}</a><a class="sbtn" href="#${next.slug}">${esc(next.name)} →</a></nav>`;
  $("#copy")?.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(p.email); $("#copy").textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("#addr")); getSelection().removeAllRanges(); getSelection().addRange(r); }
  });
  if (p.slug === "ziyun-wang") { try { window.mountAvatar?.(); } catch (e) { console.warn("3D avatar unavailable; showing the picture", e); } }
  scrollTo({ top: 0 });
}
function everyone(at) {
  document.title = "People of T-Cat’s Journey";
  const tile = (p, i) => `<a href="#${p.slug}" style="transform:rotate(${(((i * 37) % 7) - 3) * .7}deg)"><figure class="polaroid" style="margin:0"><img loading="lazy" src="assets/team/${p.slug}.jpg" alt=""><figcaption>${esc(p.name)}</figcaption><span class="rl">${esc(ROLE[p.role] || p.role)}</span></figure></a>`;
  const part = (id, title, note, ps) => ps.length ? `<h2 class="sub" id="${id}">${title}</h2><p>${note}</p><div class="grid">${ps.map(tile).join("")}</div>` : "";
  $("#view").innerHTML = `<section class="all"><div class="cap">The people on the journey</div><h1>Everyone on the planet</h1><p>Pick someone to visit their page.</p>
    <div class="grid">${PEOPLE.filter(onPlanet).map(tile).join("")}</div>
    ${part("visitors", "Visitors", "Researchers spending time with the group now.", PEOPLE.filter(p => p.role === "Visitors"))}
    ${part("alumni", "Alumni", "Former members and visitors, and where the journey took them.", PEOPLE.filter(p => p.role === "Alumni"))}</section>`;
  if (at) document.getElementById(at)?.scrollIntoView(); else scrollTo({ top: 0 });
}
function route() {
  const h = location.hash.slice(1), i = PEOPLE.findIndex(p => p.slug === h);
  i >= 0 ? profile(i) : everyone(["visitors", "alumni"].includes(h) ? h : "");
}
addEventListener("hashchange", route);
Promise.all([
  fetch("data/people.json").then(r => r.json()),
  fetch("data/publications.json").then(r => r.json()).catch(() => ({ pubs: [] }))
]).then(([pp, pubs]) => { PEOPLE = pp.people; PUBS = pubs.pubs || []; wireMenus(PEOPLE); route(); })
  .catch(() => { $("#view").innerHTML = `<p class="empty" style="padding:40px 0">The people list could not be loaded. Reload to try again.</p>`; });
</script>

<script type="module">
/* Ziyun Wang's 3D figure (tripo/ziyun-wang.glb slimmed by blender/slim_pi_model.py), shown with three.js. */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
let model = null;
const load = (urls, ok) => new GLTFLoader().load(urls[0], ok, undefined, () => urls.length > 1 && load(urls.slice(1), ok));
window.mountAvatar = () => {
  const wrap = document.getElementById("avatar3d"); if (!wrap) return;
  const cv = wrap.querySelector("canvas");
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(32, 1, .05, 50); camera.position.set(.4, 1.55, 5.2); scene.add(camera);
  const controls = new OrbitControls(camera, cv); controls.target.set(0, 1.08, 0); controls.enableDamping = true; controls.enablePan = false; controls.enableZoom = false;
  controls.minPolarAngle = .9; controls.maxPolarAngle = 1.55; controls.minAzimuthAngle = -1.2; controls.maxAzimuthAngle = 1.2;
  scene.add(new THREE.HemisphereLight(0xfff3da, 0xc8b08a, 1.6));
  const sun = new THREE.DirectionalLight(0xfff0d6, 2.2); sun.position.set(-3, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.normalBias = .02; scene.add(sun);
  let mixer = null, fig = null, t = 0; const clock = new THREE.Clock();
  load(["assets/ziyun-3d.glb?v=1127", "assets/ziyun-3d.glb.wasm"], g => {
    g.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; if (o.material.map) { o.material.alphaTest = .5; o.material.transparent = false; } } });
    scene.add(g.scene); mixer = new THREE.AnimationMixer(g.scene);
    if (!REDUCE) g.animations.forEach(c => mixer.clipAction(c).play());
    fig = g.scene;
    wrap.classList.add("live");
  });
  function frame() {
    if (!wrap.isConnected) { renderer.dispose(); return; }
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (cv.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
    const dt = clock.getDelta(); mixer?.update(dt); if (fig && !REDUCE) { t += dt; fig.rotation.y = Math.sin(t * .6) * .25; fig.position.y = Math.abs(Math.sin(t * 1.6)) * .03; } controls.update(); renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
};
if (document.getElementById("avatar3d")) { try { window.mountAvatar(); } catch (e) { console.warn("3D avatar unavailable; showing the picture", e); } }
</script>
</body>
